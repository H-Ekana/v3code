<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1600 1000"
  fill="none"
  aria-hidden="true"
  focusable="false"
>
  <defs>
    <linearGradient id="signal-beam" x1="-88" y1="0" x2="88" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A98CFF" stop-opacity="0"/>
      <stop offset=".58" stop-color="#B69CFF" stop-opacity=".16"/>
      <stop offset=".86" stop-color="#E86DBD" stop-opacity=".68"/>
      <stop offset="1" stop-color="#FFF8FF" stop-opacity=".92"/>
    </linearGradient>
    <linearGradient id="signal-orbit" x1="752" y1="450" x2="850" y2="548" gradientUnits="userSpaceOnUse">
      <stop stop-color="#AF9AFF"/>
      <stop offset="1" stop-color="#ED78C5"/>
    </linearGradient>
  </defs>

  <style>
    .signal-beam {
      transform-box: view-box;
      transform-origin: 0 0;
      opacity: 0;
    }

    .signal-beam--incoming {
      animation: signal-incoming 840ms cubic-bezier(.16, 1, .3, 1) both;
    }

    .signal-beam--outgoing {
      animation: signal-outgoing 840ms cubic-bezier(.16, 1, .3, 1) both;
    }

    .signal-residue {
      animation: signal-residue-fade 1040ms linear both;
    }

    .signal-orbit-segment {
      opacity: .1;
      animation: signal-orbit-lock 260ms cubic-bezier(0, 0, .3, 1) both;
    }

    .signal-orbit-segment--1,
    .signal-orbit-segment--5 {
      animation-delay: 250ms;
    }

    .signal-orbit-segment--2,
    .signal-orbit-segment--4 {
      animation-delay: 300ms;
    }

    .signal-orbit-segment--3 {
      animation-delay: 350ms;
    }

    .signal-link {
      fill: none;
      stroke: #8C63E8;
      stroke-width: .65;
      stroke-linecap: round;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      opacity: 0;
      animation: signal-link-draw 120ms linear both;
    }

    .signal-link--1 {
      animation-delay: 520ms;
    }

    .signal-link--2 {
      animation-delay: 730ms;
    }

    .signal-link--3 {
      animation-delay: 715ms;
    }

    .signal-link-head {
      fill: none;
      stroke: #FFF9FF;
      stroke-width: 1;
      stroke-linecap: round;
      stroke-dasharray: .14 1;
      stroke-dashoffset: 1.14;
      opacity: 0;
      animation: signal-link-head 120ms linear both;
    }

    .signal-link-head--1 {
      animation-delay: 520ms;
    }

    .signal-link-head--2 {
      animation-delay: 730ms;
    }

    .signal-link-head--3 {
      animation-delay: 715ms;
    }

    .signal-node {
      transform-box: fill-box;
      transform-origin: center;
      opacity: .11;
      animation: signal-node-lock 110ms cubic-bezier(0, 0, .3, 1) both;
    }

    .signal-node--1 {
      animation-delay: 480ms;
    }

    .signal-node--2 {
      animation-delay: 680ms;
    }

    .signal-node--3 {
      animation-delay: 875ms;
    }

    .signal-node--4 {
      animation-delay: 890ms;
    }

    .signal-contact,
    .signal-lock-pulse {
      transform-box: fill-box;
      transform-origin: center;
      opacity: 0;
    }

    .signal-contact {
      animation: signal-contact 840ms cubic-bezier(.16, 1, .3, 1) both;
    }

    .signal-lock-pulse {
      animation: signal-lock-pulse 840ms cubic-bezier(.16, 1, .3, 1) both;
    }

    @keyframes signal-incoming {
      0% {
        opacity: 0;
        transform: translate(1210px, 910px) rotate(-135deg) scaleX(.35);
      }

      6% {
        opacity: .7;
      }

      32% {
        opacity: .86;
      }

      38%,
      100% {
        opacity: 0;
        transform: translate(836.8px, 536.8px) rotate(-135deg) scaleX(1);
      }
    }

    @keyframes signal-outgoing {
      0%,
      53% {
        opacity: 0;
        transform: translate(763.9px, 462.6px) rotate(-135deg) scaleX(.4);
      }

      56% {
        opacity: .84;
      }

      92% {
        opacity: .7;
      }

      100% {
        opacity: 0;
        transform: translate(430px, 120px) rotate(-135deg) scaleX(1);
      }
    }

    @keyframes signal-contact {
      0%,
      34% {
        opacity: 0;
        transform: scale(.5);
      }

      39% {
        opacity: 1;
        transform: scale(1);
      }

      52% {
        opacity: .3;
        transform: scale(1.55);
      }

      62%,
      100% {
        opacity: 0;
        transform: scale(1.8);
      }
    }

    @keyframes signal-lock-pulse {
      0%,
      35% {
        opacity: 0;
        transform: scale(.92);
      }

      42% {
        opacity: .96;
        transform: scale(1);
      }

      56%,
      100% {
        opacity: 0;
        transform: scale(1.08);
      }
    }

    @keyframes signal-orbit-lock {
      0% {
        opacity: 0;
      }

      20% {
        opacity: .9;
      }

      62% {
        opacity: .34;
      }

      100% {
        opacity: .11;
      }
    }

    @keyframes signal-link-draw {
      0% {
        opacity: .24;
        stroke-dashoffset: 1;
      }

      72% {
        opacity: .24;
      }

      100% {
        opacity: .055;
        stroke-dashoffset: 0;
      }
    }

    @keyframes signal-link-head {
      0% {
        opacity: 0;
        stroke-dashoffset: 1.14;
      }

      16% {
        opacity: .95;
      }

      82% {
        opacity: .95;
      }

      100% {
        opacity: 0;
        stroke-dashoffset: .14;
      }
    }

    @keyframes signal-node-lock {
      0% {
        opacity: 0;
        transform: scale(.45);
      }

      22% {
        opacity: .9;
        transform: scale(1.7);
      }

      56% {
        opacity: .42;
        transform: scale(1);
      }

      100% {
        opacity: .11;
        transform: scale(1);
      }
    }

    @keyframes signal-residue-fade {
      0%,
      93% {
        opacity: 1;
      }

      100% {
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .signal-beam,
      .signal-contact,
      .signal-lock-pulse,
      .signal-link-head {
        display: none;
      }

      .signal-residue,
      .signal-orbit-segment,
      .signal-link,
      .signal-node {
        animation: none;
      }

      .signal-link {
        opacity: .055;
        stroke-dashoffset: 0;
      }
    }
  </style>

  <g class="signal-beam signal-beam--incoming">
    <rect x="-88" y="-5" width="176" height="10" rx="5" fill="url(#signal-beam)" opacity=".12"/>
    <rect x="-88" y="-.65" width="176" height="1.3" rx=".65" fill="url(#signal-beam)"/>
    <circle cx="80" r="2.1" fill="#FFF8FF" opacity=".9"/>
  </g>

  <g transform="translate(836.8 536.8)">
    <g class="signal-contact">
      <circle r="18" fill="#AF9AFF" opacity=".06"/>
      <circle r="8" fill="#ED78C5" opacity=".14"/>
      <circle r="2.6" fill="#FFF8FF"/>
    </g>
  </g>

  <g class="signal-lock-pulse" stroke="url(#signal-orbit)" stroke-linecap="round">
    <path d="M782.2 548.9A52 52 0 1 1 848.9 482.2" stroke-width="9" opacity=".1"/>
    <path d="M782.2 548.9A52 52 0 1 1 848.9 482.2" stroke-width="1.6" opacity=".92"/>
  </g>

  <g class="signal-residue">
    <g stroke="url(#signal-orbit)" stroke-linecap="round">
      <g class="signal-orbit-segment signal-orbit-segment--1">
        <path d="M782.2 548.9A52 52 0 0 1 751.1 517.8" stroke-width="7" opacity=".1"/>
        <path d="M782.2 548.9A52 52 0 0 1 751.1 517.8" stroke-width="1.3" opacity=".9"/>
      </g>
      <g class="signal-orbit-segment signal-orbit-segment--2">
        <path d="M751.1 517.8A52 52 0 0 1 755 474" stroke-width="7" opacity=".1"/>
        <path d="M751.1 517.8A52 52 0 0 1 755 474" stroke-width="1.3" opacity=".9"/>
      </g>
      <g class="signal-orbit-segment signal-orbit-segment--3">
        <path d="M755 474A52 52 0 0 1 791 448.8" stroke-width="7" opacity=".1"/>
        <path d="M755 474A52 52 0 0 1 791 448.8" stroke-width="1.3" opacity=".9"/>
      </g>
      <g class="signal-orbit-segment signal-orbit-segment--4">
        <path d="M791 448.8A52 52 0 0 1 833.4 460.2" stroke-width="7" opacity=".1"/>
        <path d="M791 448.8A52 52 0 0 1 833.4 460.2" stroke-width="1.3" opacity=".9"/>
      </g>
      <g class="signal-orbit-segment signal-orbit-segment--5">
        <path d="M833.4 460.2A52 52 0 0 1 848.9 482.2" stroke-width="7" opacity=".1"/>
        <path d="M833.4 460.2A52 52 0 0 1 848.9 482.2" stroke-width="1.3" opacity=".9"/>
      </g>
    </g>

    <g fill="none" stroke-linecap="round">
      <path class="signal-link signal-link--1" d="M702 392L631 301" pathLength="1"/>
      <path class="signal-link-head signal-link-head--1" d="M702 392L631 301" pathLength="1"/>
      <path class="signal-link signal-link--2" d="M631 301L481 159" pathLength="1"/>
      <path class="signal-link-head signal-link-head--2" d="M631 301L481 159" pathLength="1"/>
      <path class="signal-link signal-link--3" d="M631 301L575 330" pathLength="1"/>
      <path class="signal-link-head signal-link-head--3" d="M631 301L575 330" pathLength="1"/>
    </g>

    <g transform="translate(702 392)" color="#C7B5FF">
      <g class="signal-node signal-node--1">
        <circle r="4" fill="currentColor" opacity=".08"/>
        <circle r="1.7" fill="currentColor"/>
      </g>
    </g>
    <g transform="translate(631 301)" color="#C7B5FF">
      <g class="signal-node signal-node--2">
        <circle r="4" fill="currentColor" opacity=".08"/>
        <circle r="1.7" fill="currentColor"/>
      </g>
    </g>
    <g transform="translate(575 330)" color="#EB83C9">
      <g class="signal-node signal-node--3">
        <circle r="4" fill="currentColor" opacity=".08"/>
        <circle r="1.7" fill="currentColor"/>
      </g>
    </g>
    <g transform="translate(481 159)" color="#F4EEFF">
      <g class="signal-node signal-node--4">
        <circle r="6" fill="none" stroke="currentColor" stroke-width=".65" opacity=".24"/>
        <circle r="1.7" fill="currentColor"/>
      </g>
    </g>
  </g>

  <g class="signal-beam signal-beam--outgoing">
    <rect x="-88" y="-5" width="176" height="10" rx="5" fill="url(#signal-beam)" opacity=".12"/>
    <rect x="-88" y="-.65" width="176" height="1.3" rx=".65" fill="url(#signal-beam)"/>
    <circle cx="80" r="2.1" fill="#FFF8FF" opacity=".9"/>
  </g>
</svg>
