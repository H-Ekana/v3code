    <path class="spark-twinkle spark-twinkle--c" d="M0-12C1.4-3.4 3.4-1.4 12 0 3.4 1.4 1.4 3.4 0 12-1.4 3.4-3.4 1.4-12 0-3.4-1.4-1.4-3.4 0-12Z" transform="translate(574 246)"/>
    <path class="spark-twinkle spark-twinkle--b" d="M0-15C1.7-4.2 4.2-1.7 15 0 4.2 1.7 1.7 4.2 0 15-1.7 4.2-4.2 1.7-15 0-4.2-1.7-1.7-4.2 0-15Z" transform="translate(1386 206)"/>
    <path class="spark-twinkle spark-twinkle--c" d="M0-9C1-2.5 2.5-1 9 0 2.5 1 1 2.5 0 9-1 2.5-2.5 1-9 0-2.5-1-1-2.5 0-9Z" transform="translate(1118 178)"/>
