<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" fill="none">
  <defs>
    <radialGradient id="violet-haze" cx="0" cy="0" r="1" gradientTransform="translate(1180 220) rotate(143) scale(360 250)">
      <stop stop-color="#9B5DE5" stop-opacity=".14"/>
      <stop offset=".55" stop-color="#6E3CC7" stop-opacity=".05"/>
      <stop offset="1" stop-color="#2A174E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pink-haze" cx="0" cy="0" r="1" gradientTransform="translate(360 360) rotate(35) scale(270 190)">
      <stop stop-color="#ED5FB7" stop-opacity=".08"/>
      <stop offset="1" stop-color="#8B3BA4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="meteor-tail" x1="-168" y1="0" x2="0" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8350D9" stop-opacity="0"/>
      <stop offset=".56" stop-color="#A77BFF" stop-opacity=".2"/>
      <stop offset=".86" stop-color="#F27BC6" stop-opacity=".72"/>
      <stop offset="1" stop-color="#FFF9FF" stop-opacity=".96"/>
    </linearGradient>
  </defs>

  <style>
    .spark-twinkle {
      --twinkle-duration: 4s;
      --twinkle-delay: 0s;
      opacity: .62;
      animation: star-twinkle var(--twinkle-duration) cubic-bezier(.45, 0, .55, 1) var(--twinkle-delay) infinite;
    }
    .spark-twinkle--a {
      --twinkle-duration: 3.4s;
      --twinkle-delay: -1.1s;
    }
    .spark-twinkle--b {
      --twinkle-duration: 4.8s;
      --twinkle-delay: -3.2s;
    }
    .spark-twinkle--c {
      --twinkle-duration: 4.1s;
      --twinkle-delay: -2.2s;
    }
    .star-drift {
      animation: star-drift var(--drift-duration) cubic-bezier(.45, 0, .55, 1) var(--drift-delay) infinite alternate;
      will-change: translate;
    }
    .spark-twinkle.star-drift {
      animation:
        star-twinkle var(--twinkle-duration) cubic-bezier(.45, 0, .55, 1) var(--twinkle-delay) infinite,
        star-drift var(--drift-duration) cubic-bezier(.45, 0, .55, 1) var(--drift-delay) infinite alternate;
    }
    .star-drift--a {
      --drift-duration: 17s;
      --drift-delay: -4s;
      --drift-from: -6px -2px;
      --drift-to: 10px 2px;
    }
    .star-drift--b {
      --drift-duration: 21s;
      --drift-delay: -9s;
      --drift-from: -8px 1px;
      --drift-to: 13px 4px;
    }
    .star-drift--c {
      --drift-duration: 25s;
      --drift-delay: -13s;
      --drift-from: -5px -3px;
      --drift-to: 9px 1px;
    }
    .star-drift--d {
      --drift-duration: 29s;
      --drift-delay: -18s;
      --drift-from: -10px 0;
      --drift-to: 12px 3px;
    }
    .star-drift--e {
      --drift-duration: 23s;
      --drift-delay: -7s;
      --drift-from: -7px 2px;
      --drift-to: 11px -1px;
    }
    .meteor-origin,
    .shooting-star {
      animation-timing-function: linear;
      animation-iteration-count: infinite;
    }
    .meteor-origin {
      animation-name: meteor-origin-hide;
    }
    .meteor-origin--a,
    .shooting-star--a {
      animation-duration: 8.2s;
      animation-delay: -5.622s;
    }
    .meteor-origin--b,
    .shooting-star--b {
      animation-duration: 10.7s;
      animation-delay: -6.847s;
    }
    .meteor-origin--c,
    .shooting-star--c {
      animation-duration: 13.4s;
      animation-delay: -8.264s;
    }
    .shooting-star {
      opacity: 0;
      transform-box: view-box;
      transform-origin: 0 0;
      will-change: transform;
    }
    .shooting-star--a {
      animation-name: shooting-star-a;
    }
    .shooting-star--b {
      animation-name: shooting-star-b;
    }
    .shooting-star--c {
      animation-name: shooting-star-c;
    }
    .meteor-core {
      stroke: #FFF9FF;
      stroke-width: 1;
      stroke-linecap: round;
      stroke-opacity: .78;
    }
    .meteor-glow {
      stroke: #B56FFF;
      stroke-width: 7;
      stroke-linecap: round;
      stroke-opacity: .24;
    }
    .meteor-head {
      fill: #FFF;
      filter:
        drop-shadow(0 0 4px rgb(255 232 255 / 100%))
        drop-shadow(0 0 9px rgb(219 122 255 / 88%));
    }
    @keyframes star-drift {
      from {
        translate: var(--drift-from);
      }

      to {
        translate: var(--drift-to);
      }
    }
    @keyframes star-twinkle {
      0%,
      100% {
        opacity: .2;
        filter: drop-shadow(0 0 0 rgb(216 168 255 / 0%));
      }

      20% {
        opacity: .38;
        filter: drop-shadow(0 0 2px rgb(216 168 255 / 24%));
      }

      42% {
        opacity: 1;
        filter:
          drop-shadow(0 0 4px rgb(244 223 255 / 88%))
          drop-shadow(0 0 12px rgb(201 126 255 / 72%));
      }

      56% {
        opacity: .68;
        filter: drop-shadow(0 0 5px rgb(240 195 255 / 42%));
      }

      78% {
        opacity: .3;
        filter: drop-shadow(0 0 1px rgb(216 168 255 / 12%));
      }
    }
    @keyframes shooting-star-a {
      0%,
      71% {
        opacity: 0;
        transform: translate(1386px, 206px) rotate(145deg) scaleX(.3);
      }

      72% {
        opacity: .94;
        transform: translate(1386px, 206px) rotate(145deg) scaleX(.42);
      }

      80.5% {
        opacity: .86;
        transform: translate(1034px, 453px) rotate(145deg) scaleX(1);
      }

      84%,
      100% {
        opacity: 0;
        transform: translate(940px, 519px) rotate(145deg) scaleX(1.06);
      }
    }

    @keyframes shooting-star-b {
      0%,
      71% {
        opacity: 0;
        transform: translate(844px, 142px) rotate(34deg) scaleX(.3);
      }

      72% {
        opacity: .94;
        transform: translate(844px, 142px) rotate(34deg) scaleX(.42);
      }

      80.5% {
        opacity: .86;
        transform: translate(1200px, 374px) rotate(34deg) scaleX(1);
      }

      84%,
      100% {
        opacity: 0;
        transform: translate(1292px, 434px) rotate(34deg) scaleX(1.06);
      }
    }

    @keyframes shooting-star-c {
      0%,
      71% {
        opacity: 0;
        transform: translate(492px, 105px) rotate(35deg) scaleX(.3);
      }

      72% {
        opacity: .94;
        transform: translate(492px, 105px) rotate(35deg) scaleX(.42);
      }

      80.5% {
        opacity: .86;
        transform: translate(838px, 346px) rotate(35deg) scaleX(1);
      }

      84%,
      100% {
        opacity: 0;
        transform: translate(930px, 410px) rotate(35deg) scaleX(1.06);
      }
    }

    @keyframes meteor-origin-hide {
      0%,
      70.5%,
      85%,
      100% {
        opacity: 1;
      }

      72%,
      83.5% {
        opacity: 0;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .star-drift,
      .spark-twinkle,
      .meteor-origin,
      .shooting-star {
        animation: none;
      }
      .star-drift {
        translate: none;
      }
      .meteor-origin {
        opacity: 1;
      }
      .shooting-star {
        opacity: 0;
      }
    }
  </style>

  <ellipse cx="1180" cy="220" rx="360" ry="250" fill="url(#violet-haze)"/>
  <ellipse cx="360" cy="360" rx="270" ry="190" fill="url(#pink-haze)"/>

  <g fill="#F8F4FF">
    <path class="spark-twinkle spark-twinkle--a star-drift star-drift--a" d="M0-16C1.8-4.5 4.5-1.8 16 0 4.5 1.8 1.8 4.5 0 16-1.8 4.5-4.5 1.8-16 0-4.5-1.8-1.8-4.5 0-16Z" transform="translate(164 168)"/>
    <path class="spark-twinkle spark-twinkle--c star-drift star-drift--c" d="M0-12C1.4-3.4 3.4-1.4 12 0 3.4 1.4 1.4 3.4 0 12-1.4 3.4-3.4 1.4-12 0-3.4-1.4-1.4-3.4 0-12Z" transform="translate(574 246)"/>
    <g class="meteor-origin meteor-origin--a" transform="translate(1386 206)">
      <path class="spark-twinkle spark-twinkle--b" d="M0-15C1.7-4.2 4.2-1.7 15 0 4.2 1.7 1.7 4.2 0 15-1.7 4.2-4.2 1.7-15 0-4.2-1.7-1.7-4.2 0-15Z"/>
    </g>
    <path class="spark-twinkle spark-twinkle--c star-drift star-drift--e" d="M0-9C1-2.5 2.5-1 9 0 2.5 1 1 2.5 0 9-1 2.5-2.5 1-9 0-2.5-1-1-2.5 0-9Z" transform="translate(1118 178)"/>
    <path class="spark-twinkle spark-twinkle--a star-drift star-drift--b" d="M0-8C.9-2.2 2.2-.9 8 0 2.2.9.9 2.2 0 8-.9 2.2-2.2.9-8 0-2.2-.9-.9-2.2 0-8Z" transform="translate(1502 318)"/>
  </g>

  <g fill="#D8C3FF">
    <path class="spark-twinkle spark-twinkle--b star-drift star-drift--d" d="M0-11C1.2-3.1 3.1-1.2 11 0 3.1 1.2 1.2 3.1 0 11-1.2 3.1-3.1 1.2-11 0-3.1-1.2-1.2-3.1 0-11Z" transform="translate(286 232)"/>
    <g class="meteor-origin meteor-origin--b" transform="translate(844 142)">
      <path class="spark-twinkle spark-twinkle--a" d="M0-8C.9-2.2 2.2-.9 8 0 2.2.9.9 2.2 0 8-.9 2.2-2.2.9-8 0-2.2-.9-.9-2.2 0-8Z"/>
    </g>
    <path class="spark-twinkle spark-twinkle--b star-drift star-drift--a" d="M0-10C1.1-2.8 2.8-1.1 10 0 2.8 1.1 1.1 2.8 0 10-1.1 2.8-2.8 1.1-10 0-2.8-1.1-1.1-2.8 0-10Z" transform="translate(1228 505)"/>
    <path class="star-drift star-drift--c" d="M0-7C.8-2 2-.8 7 0 2 .8.8 2 0 7-.8 2-2 .8-7 0-2-.8-.8-2 0-7Z" transform="translate(362 442)"/>
  </g>

  <g fill="#FF8FD2">
    <g class="meteor-origin meteor-origin--c" transform="translate(492 105)">
      <path class="spark-twinkle spark-twinkle--c" d="M0-10C1.1-2.8 2.8-1.1 10 0 2.8 1.1 1.1 2.8 0 10-1.1 2.8-2.8 1.1-10 0-2.8-1.1-1.1-2.8 0-10Z"/>
    </g>
    <path class="spark-twinkle spark-twinkle--a star-drift star-drift--b" d="M0-13C1.5-3.7 3.7-1.5 13 0 3.7 1.5 1.5 3.7 0 13-1.5 3.7-3.7 1.5-13 0-3.7-1.5-1.5-3.7 0-13Z" transform="translate(1162 302)"/>
    <path class="spark-twinkle spark-twinkle--b star-drift star-drift--e" d="M0-7C.8-2 2-.8 7 0 2 .8.8 2 0 7-.8 2-2 .8-7 0-2-.8-.8-2 0-7Z" transform="translate(78 360)"/>
    <path class="spark-twinkle spark-twinkle--c star-drift star-drift--d" d="M0-8C.9-2.2 2.2-.9 8 0 2.2.9.9 2.2 0 8-.9 2.2-2.2.9-8 0-2.2-.9-.9-2.2 0-8Z" transform="translate(1464 122)"/>
  </g>

  <g fill="#F4ECFF">
    <circle class="star-drift star-drift--c" cx="126" cy="126" r="2.2"/>
    <circle class="star-drift star-drift--a" cx="207" cy="196" r="1.5"/>
    <circle class="star-drift star-drift--e" cx="252" cy="122" r="2.6"/>
    <circle class="star-drift star-drift--b" cx="326" cy="182" r="1.4"/>
    <circle class="star-drift star-drift--d" cx="535" cy="156" r="1.7"/>
    <circle class="star-drift star-drift--a" cx="548" cy="286" r="2.2"/>
    <circle class="star-drift star-drift--c" cx="632" cy="208" r="1.3"/>
    <circle class="star-drift star-drift--e" cx="752" cy="80" r="2.4"/>
    <circle class="star-drift star-drift--b" cx="914" cy="72" r="1.5"/>
    <circle class="star-drift star-drift--d" cx="1070" cy="118" r="1.6"/>
    <circle class="star-drift star-drift--a" cx="1210" cy="112" r="2.1"/>
    <circle class="star-drift star-drift--c" cx="1254" cy="214" r="1.3"/>
    <circle class="star-drift star-drift--e" cx="1428" cy="236" r="2.4"/>
    <circle class="star-drift star-drift--b" cx="1518" cy="86" r="1.4"/>
    <circle class="star-drift star-drift--d" cx="344" cy="460" r="1.7"/>
    <circle class="star-drift star-drift--a" cx="1260" cy="540" r="2.2"/>
    <circle class="star-drift star-drift--c" cx="1522" cy="448" r="1.5"/>
  </g>

  <g fill="#F173C4">
    <circle class="star-drift star-drift--b" cx="236" cy="276" r="2.3"/>
    <circle class="star-drift star-drift--d" cx="596" cy="520" r="1.8"/>
    <circle class="star-drift star-drift--a" cx="1062" cy="134" r="1.6"/>
    <circle class="star-drift star-drift--e" cx="1368" cy="552" r="1.7"/>
    <circle class="star-drift star-drift--c" cx="1186" cy="238" r="1.2"/>
    <circle class="star-drift star-drift--b" cx="1488" cy="182" r="1.2"/>
  </g>
  <g class="shooting-star shooting-star--a">
    <path class="meteor-glow" d="M-138 0H-5"/>
    <path d="M-168 0H0" stroke="url(#meteor-tail)" stroke-width="2.8" stroke-linecap="round"/>
    <path class="meteor-core" d="M-72 0H0"/>
    <circle class="meteor-head" r="3"/>
  </g>
  <g class="shooting-star shooting-star--b">
    <path class="meteor-glow" d="M-124 0H-5"/>
    <path d="M-150 0H0" stroke="url(#meteor-tail)" stroke-width="2.5" stroke-linecap="round"/>
    <path class="meteor-core" d="M-62 0H0"/>
    <circle class="meteor-head" r="2.8"/>
  </g>
  <g class="shooting-star shooting-star--c">
    <path class="meteor-glow" d="M-130 0H-5"/>
    <path d="M-158 0H0" stroke="url(#meteor-tail)" stroke-width="2.6" stroke-linecap="round"/>
    <path class="meteor-core" d="M-66 0H0"/>
    <circle class="meteor-head" r="2.9"/>
  </g>
</svg>
