<!doctype html>
<html lang="en" class="dark" data-startup-splash="holding">
  <head>
    <meta charset="UTF-8" />
    <title>Splash lab</title>
    <link rel="stylesheet" href="./splash-lab-app.css" />
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        background: #ffffff;
        color: #262626;
        font-family:
          "DM Sans Variable",
          "DM Sans",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          system-ui,
          sans-serif;
      }

      html.dark body {
        background: #161616;
        color: #f5f5f5;
      }

      /* The boot art is split across three sibling layers so the app can be sandwiched
         between them during the parting: the shell drops below #root while the foreground
         clouds stay above it, which is what lets the composer rise THROUGH the sky rather
         than behind it. A single container could never do this — `isolation: isolate`
         composites all of its children as one unit, so nothing can be interleaved. */
      .v3-splash,
      .v3-splash-layer {
        position: fixed;
        inset: 0;
        display: flex;
        overflow: hidden;
        align-items: center;
        justify-content: center;
        background: transparent;
      }

      .v3-splash {
        z-index: 70;
        isolation: isolate;
        pointer-events: auto;
      }

      /* Never interactive: these sit above the app while it is already usable. */
      .v3-splash-layer {
        pointer-events: none;
      }

      #boot-foreground {
        z-index: 71;
      }

      #boot-logo {
        z-index: 72;
      }

      .v3-splash::before {
        position: absolute;
        z-index: -2;
        inset: 0;
        background:
          radial-gradient(circle at 50% 52%, rgb(117 67 165 / 5%), transparent 22rem), #ffffff;
        content: "";
      }

      .v3-splash-status {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        clip-path: inset(50%);
        white-space: nowrap;
      }

      html.dark .v3-splash::before {
        background:
          radial-gradient(circle at 50% 52%, rgb(137 73 196 / 8%), transparent 23rem), #161616;
      }

      html[data-startup-splash="bypass"] #boot-shell,
      html[data-startup-splash="bypass"] #boot-foreground,
      html[data-startup-splash="bypass"] #boot-logo {
        display: none;
      }

      html[data-startup-splash="holding"] #root {
        opacity: 0;
      }

      /* NO copy of the app mark may exist in the chrome until the flight delivers one —
         otherwise the logo appears to fly toward a copy of itself and merely swap places
         with it. That covers the sidebar brand (the flight's destination; its reveal is the
         WAAPI cross-fade at touchdown, which outranks this rule) AND any other stand-in
         like the ChatHeader project favicon, which for a project like v3code is visually
         the same mark. Brand marks return via their own transition when the state flips to
         "complete". */
      html[data-startup-splash="holding"] [data-startup-logo-target],
      html[data-startup-splash="exiting"] [data-startup-logo-target],
      html[data-startup-splash="holding"] [data-startup-brand-mark],
      html[data-startup-splash="exiting"] [data-startup-brand-mark] {
        opacity: 0;
      }

      /*
       * The shell KEEPS its z-index during the parting and dissolves on top of the app.
       *
       * An earlier design dropped it to z-index 0 so app content could interleave between
       * the mid and foreground cloud bands — but that swap and the app turning opaque happen
       * in the same frame, so the entire app popped into view behind the sky at T0. The
       * reveal must come from the veil (::before) clearing and each art layer animating out
       * ABOVE an already-opaque app: the app then emerges gradually, and since the shell is
       * a sibling overlay rather than an ancestor, none of this touches the composer's
       * glass. The foreground bands (z71) still pass in front of the rising composer.
       */
      html[data-startup-splash="exiting"] #boot-shell {
        pointer-events: none;
      }

      /* Motion tokens. One curve applied to everything gives every object identical
         apparent mass, which is most of what reads as "mechanical". The two springs are
         sampled from real damped-spring solutions (mass/stiffness/damping) — something
         cubic-bezier cannot express — so heavy and light things settle differently. */
      :root {
        --v3-ease-veil: cubic-bezier(0.16, 1, 0.3, 1);
        --v3-ease-fall: cubic-bezier(0.45, 0, 0.75, 0.6);
        /* heavy: the composer. stiffness 110, damping 18 — one soft settle, ~0.5% overshoot */
        --v3-ease-rise: linear(
          0,
          0.022,
          0.077,
          0.153,
          0.239,
          0.329,
          0.418,
          0.503,
          0.581,
          0.652,
          0.714,
          0.769,
          0.815,
          0.854,
          0.887,
          0.914,
          0.936,
          0.954,
          0.968,
          0.979,
          0.987,
          0.993,
          0.998,
          1.001,
          1.003,
          1.004,
          1.005,
          1.005,
          1.005,
          1.005,
          1.005,
          1.004,
          1.004,
          1.003,
          1.003,
          1.002,
          1
        );
        /* light: panels and rails. stiffness 170, damping 26 — quicker, no overshoot */
        --v3-ease-slide: linear(
          0,
          0.029,
          0.098,
          0.187,
          0.283,
          0.378,
          0.468,
          0.549,
          0.621,
          0.684,
          0.739,
          0.785,
          0.823,
          0.856,
          0.883,
          0.905,
          0.923,
          0.938,
          0.95,
          0.96,
          0.968,
          0.974,
          0.98,
          0.984,
          0.987,
          0.99,
          0.992,
          0.994,
          0.995,
          0.996,
          0.997,
          0.997,
          1
        );
      }

      /* Short deliberately: an ancestor with opacity < 1 becomes a Backdrop Root, so while
         this runs the composer's backdrop-filter samples an empty backdrop and its glass
         renders flat, then snaps. Keeping it brief and starting the composer after it means
         the glass is never visible in the broken state. */
      /*
       * Everything below waits for the strike at 560ms and the recoil that follows it. The
       * app must not begin arriving while the meteor is still inbound — the whole point of
       * the sequence is that one thing moves at a time and each beat causes the next.
       */
      /*
       * NOTHING on the path to the composer animates opacity. Per the Filter Effects spec an
       * element with opacity < 1 becomes a Backdrop Root for its descendants — so a fade on
       * #root, on the workspace, or on the composer itself makes the composer's
       * backdrop-filter sample an empty backdrop and render flat, then snap to its real
       * saturated appearance the instant the fade completes. That snap is the saturation
       * jump, and no amount of reordering removes it: it is caused by the fades existing.
       *
       * So the app is revealed by its furniture travelling in, not by anything dissolving.
       * #root simply becomes opaque; the surface behind it is the same colour as the page
       * background, so there is nothing to see in the switch itself.
       */
      html[data-startup-splash="exiting"] #root {
        position: relative;
        z-index: 1;
        opacity: 1;
      }

      /* The veil IS the reveal: the app sits opaque underneath it from T0, and only becomes
         visible as this clears. Starts with the parting (900ms) and finishes inside the exit
         window, so the app emerges over a full second rather than popping in one frame. */
      html[data-startup-splash="exiting"] .v3-splash::before {
        animation: v3-startup-veil-open 1200ms 900ms var(--v3-ease-veil) both;
      }

      /*
       * Opacity and transform run as SEPARATE animations throughout, and this is the whole
       * trick. A CSS keyframe timing function applies per interval to EVERY property in it,
       * so a single animation forced the fade to ride the travel curve. On ease-out-expo an
       * element is already 91% of the way there by the 34% mark — so it was invisible for
       * almost its entire journey and simply materialised near its destination. Nothing you
       * can't see can read as parallax.
       *
       * Fades are short and linear; travel is long and sprung.
       */
      /* Lands at 1460ms — the same instant the mark's flight touches down on it. Slide only:
         it starts fully off-screen, so a fade would buy nothing and the sidebar carries its
         own translucent surfaces that a partial opacity would flatten. */
      html[data-startup-splash="exiting"] [data-app-sidebar] {
        animation: v3-startup-sidebar-slide 1000ms 460ms var(--v3-ease-slide) both;
      }

      /* Transform only — this is an ancestor of the composer's glass. */
      html[data-startup-splash="exiting"] [data-slot="sidebar-inset"] {
        animation: v3-startup-workspace-rise 900ms 780ms var(--v3-ease-slide) both;
      }

      /*
       * The heavy object: slowest, most travel, and the only thing with real overshoot.
       *
       * No fade — it starts below the fold and rises into view, so it never needs one. Its
       * own opacity would make it a Backdrop Root for the ::before that carries its glass,
       * which is the same snap an ancestor fade causes.
       */
      html[data-startup-splash="exiting"] [data-startup-composer-target] {
        animation: v3-startup-composer-rise 1500ms 950ms var(--v3-ease-rise) both;
        will-change: transform;
      }

      .v3-splash-art {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        user-select: none;
        object-fit: cover;
      }

      .v3-splash-stars {
        opacity: 0.22;
        mix-blend-mode: multiply;
      }

      /* Distant galaxies: static set dressing behind the stars, so the sky reads as deep
         space. Dimmer than the starfield in both themes — they must never compete with the
         meteors for attention. */
      .v3-splash-galaxies {
        opacity: 0.16;
        mix-blend-mode: multiply;
      }

      html.dark .v3-splash-galaxies {
        opacity: 0.42;
        mix-blend-mode: screen;
      }

      .v3-splash-cloud-layer {
        right: auto;
        left: -10%;
        width: 120%;
        max-width: none;
        height: auto;
        object-fit: fill;
        object-position: center bottom;
        transform-origin: center bottom;
        will-change: transform;
      }

      .v3-splash-clouds-mid {
        top: auto;
        bottom: 5%;
        height: 52%;
        opacity: 0.16;
        filter: saturate(0.72) brightness(0.88) blur(0.45px);
        -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 38%, transparent 72%);
        mask-image: linear-gradient(to bottom, #000 0%, #000 38%, transparent 72%);
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        animation: v3-cloud-mid-drift 12s cubic-bezier(0.45, 0, 0.55, 1) -2.7s infinite alternate;
      }

      .v3-splash-clouds-foreground {
        top: auto;
        bottom: -2%;
        height: 64%;
        opacity: 0.3;
        filter: saturate(0.78) brightness(0.86) blur(0.25px);
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
      }

      .v3-splash-clouds-foreground-left {
        -webkit-mask-image: linear-gradient(to right, #000 0%, #000 34%, transparent 44%);
        mask-image: linear-gradient(to right, #000 0%, #000 34%, transparent 44%);
        animation: v3-cloud-foreground-left-drift 15s cubic-bezier(0.45, 0, 0.55, 1) -4.2s infinite
          alternate;
      }

      /*
       * These three masks TILE — left covers 0-44%, centre 34-66%, right 56-100%, meeting in
       * narrow crossfade bands. They are three views of the same WebP, so any overlap beyond
       * those seams paints the identical cloud twice at slightly different drift offsets,
       * which reads as double vision. Widening the centre plateau for occlusion broke the
       * tiling and did exactly that. Occlusion has to come from opacity, not from width.
       */
      .v3-splash-clouds-foreground-center {
        -webkit-mask-image: linear-gradient(
          to right,
          transparent 34%,
          #000 44%,
          #000 56%,
          transparent 66%
        );
        mask-image: linear-gradient(to right, transparent 34%, #000 44%, #000 56%, transparent 66%);
        animation: v3-cloud-foreground-center-drift 18s cubic-bezier(0.45, 0, 0.55, 1) -8.1s
          infinite alternate;
      }

      .v3-splash-clouds-foreground-right {
        -webkit-mask-image: linear-gradient(to right, transparent 56%, #000 66%, #000 100%);
        mask-image: linear-gradient(to right, transparent 56%, #000 66%, #000 100%);
        animation: v3-cloud-foreground-right-drift 14s cubic-bezier(0.45, 0, 0.55, 1) -5.7s infinite
          alternate;
      }

      .v3-splash-signal {
        opacity: 0.34;
        mix-blend-mode: multiply;
      }

      /*
       * Parallax dust. Two sparse mote fields at different depths: the far one lives in the
       * shell behind the midground cloud, the near one in the foreground layer in front of the
       * app but behind the foreground cloud bands. The clouds themselves are smooth and blurred
       * so their differential drift is nearly invisible — these small bright points are the
       * trackable feature that makes the depth read (research B2.4/C5). Drift is authored on the
       * <g> groups only, one will-change per group, so the individual motes never get a layer.
       */
      .v3-splash-mote-group {
        will-change: transform;
      }

      /* Far field: slow, small excursions, out of phase via negative delays. */
      .v3-splash-motes-far .v3-splash-mote-group-a {
        animation: v3-mote-drift-far-a 38s ease-in-out -12.4s infinite alternate;
      }

      .v3-splash-motes-far .v3-splash-mote-group-b {
        animation: v3-mote-drift-far-b 34s ease-in-out -7.1s infinite alternate;
      }

      .v3-splash-motes-far .v3-splash-mote-group-c {
        animation: v3-mote-drift-far-c 40s ease-in-out -19.6s infinite alternate;
      }

      /* Near field: noticeably faster and travelling further — that gap IS the parallax. */
      .v3-splash-motes-near .v3-splash-mote-group-d {
        animation: v3-mote-drift-near-d 22s ease-in-out -5.3s infinite alternate;
      }

      .v3-splash-motes-near .v3-splash-mote-group-e {
        animation: v3-mote-drift-near-e 26s ease-in-out -14.2s infinite alternate;
      }

      html.dark .v3-splash-stars {
        opacity: 0.58;
        mix-blend-mode: screen;
      }

      html.dark .v3-splash-signal {
        opacity: 0.78;
        mix-blend-mode: screen;
      }

      html.dark .v3-splash-clouds-mid {
        opacity: 0.25;
        filter: saturate(0.76) brightness(0.74) blur(0.45px);
      }

      html.dark .v3-splash-clouds-foreground {
        opacity: 0.43;
        filter: saturate(0.82) brightness(0.76) blur(0.25px);
      }

      @keyframes v3-cloud-mid-drift {
        0% {
          transform: translate3d(-3.2%, 7px, 0) scale(1.018);
        }

        48% {
          transform: translate3d(0.4%, -10px, 0) scale(1.05);
        }

        100% {
          transform: translate3d(3.1%, 1px, 0) scale(1.032);
        }
      }

      @keyframes v3-cloud-foreground-left-drift {
        0% {
          transform: translate3d(1.6%, 5px, 0) scale(1.014);
        }

        50% {
          transform: translate3d(-0.2%, -5px, 0) scale(1.035);
        }

        100% {
          transform: translate3d(-1.3%, 1px, 0) scale(1.024);
        }
      }

      @keyframes v3-cloud-foreground-center-drift {
        0% {
          transform: translate3d(-0.8%, 3px, 0) scale(1.018);
        }

        52% {
          transform: translate3d(0.6%, -7px, 0) scale(1.04);
        }

        100% {
          transform: translate3d(1.2%, 0, 0) scale(1.026);
        }
      }

      @keyframes v3-cloud-foreground-right-drift {
        0% {
          transform: translate3d(1.4%, 6px, 0) scale(1.012);
        }

        55% {
          transform: translate3d(-0.4%, -3px, 0) scale(1.032);
        }

        100% {
          transform: translate3d(-1.7%, 2px, 0) scale(1.022);
        }
      }

      /* Mote drift. Translations are in user units (the 1600x1000 viewBox), so a given px
         value is a fixed share of the field regardless of viewport. Far excursions are small
         and slow; near excursions are ~2.5x larger over shorter loops, so the near field
         visibly outruns the far one. */
      @keyframes v3-mote-drift-far-a {
        from {
          transform: translate3d(-13px, 7px, 0);
        }

        to {
          transform: translate3d(15px, -8px, 0);
        }
      }

      @keyframes v3-mote-drift-far-b {
        from {
          transform: translate3d(11px, -9px, 0);
        }

        to {
          transform: translate3d(-12px, 10px, 0);
        }
      }

      @keyframes v3-mote-drift-far-c {
        from {
          transform: translate3d(-9px, -6px, 0);
        }

        to {
          transform: translate3d(12px, 9px, 0);
        }
      }

      @keyframes v3-mote-drift-near-d {
        from {
          transform: translate3d(-34px, 15px, 0);
        }

        to {
          transform: translate3d(38px, -22px, 0);
        }
      }

      @keyframes v3-mote-drift-near-e {
        from {
          transform: translate3d(30px, -20px, 0);
        }

        to {
          transform: translate3d(-33px, 24px, 0);
        }
      }

      @keyframes v3-startup-veil-open {
        0%,
        16% {
          opacity: 1;
        }

        54% {
          opacity: 0.76;
        }

        100% {
          opacity: 0;
        }
      }

      /* Slides in from fully off-screen so it arrives at the same instant the logo lands on
         it — the two are meant to meet, travelling toward each other. */
      @keyframes v3-startup-sidebar-slide {
        from {
          transform: translate3d(-100%, 0, 0);
        }

        to {
          transform: translate3d(0, 0, 0);
        }
      }

      /* No blur or scale here: this is a full-viewport subtree and an ancestor of the
         composer's backdrop-filter, so both were expensive and visually wrong. */
      @keyframes v3-startup-workspace-rise {
        from {
          transform: translate3d(0, 14px, 0);
        }

        to {
          transform: translate3d(0, 0, 0);
        }
      }

      /* Travel is deliberately shorter than it was (72vh -> 34vh). Long travel completed in
         about a second moves too fast to track, and you cannot perceive parallax against
         something your eye cannot follow — visible-the-whole-way beats far-and-fast.
         No blur: this element hosts a backdrop-filter, and an ancestor filter or opacity
         makes it the backdrop root, which blanks the glass and then pops.
         The spring supplies the settle, so there is no hand-authored overshoot keyframe. */
      /* Starts fully below the fold, which is what lets it arrive with no fade at all: there
         is nothing to hide because it is off-screen until it rises into view. */
      @keyframes v3-startup-composer-rise {
        from {
          transform: translate3d(0, min(58vh, 540px), 0) scale(0.968);
        }

        to {
          transform: translate3d(0, 0, 0) scale(1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .v3-splash-clouds-mid,
        .v3-splash-clouds-foreground,
        .v3-splash-mote-group {
          animation: none;
        }

        .v3-splash-clouds-mid {
          transform: translateY(-2px) scale(1.03);
        }

        .v3-splash-clouds-foreground {
          transform: scale(1.022);
        }

        /* The app itself never fades, here either — the same Backdrop Root snap would apply.
           The cross-dissolve is carried entirely by the boot layers fading out ON TOP of a
           fully opaque app, which is the reduced-motion-safe continuity cue and leaves every
           translucent surface underneath rendering correctly the whole time. */
        html[data-startup-splash="exiting"] #root {
          opacity: 1;
        }

        html[data-startup-splash="exiting"] .v3-splash::before {
          animation: v3-startup-veil-open 260ms linear both;
        }

        /* Translation, scaling and parallax are the vestibular triggers; with the app
           revealed by the layers above it dissolving, none of these need to move at all. */
        html[data-startup-splash="exiting"] [data-app-sidebar],
        html[data-startup-splash="exiting"] [data-slot="sidebar-inset"],
        html[data-startup-splash="exiting"] [data-startup-composer-target] {
          animation: none;
        }
      }

      .v3-splash-card {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 120px;
        height: 120px;
      }

      .v3-splash-card::before {
        position: absolute;
        z-index: -1;
        width: 240px;
        height: 240px;
        border-radius: 999px;
        background: radial-gradient(circle, rgb(158 81 205 / 8%), transparent 66%);
        content: "";
      }

      .v3-splash-logo {
        width: 64px;
        height: 64px;
        filter: drop-shadow(0 9px 22px rgb(65 32 92 / 24%));
        object-fit: contain;
      }

      /* Anchored so a transform of zero puts the meteor's head on the mark. `overflow:
         visible` lets a 370px streak draw out of a 1px box. */
      .v3-splash-hero-meteor {
        position: absolute;
        top: 50%;
        left: 50%;
        z-index: 2;
        overflow: visible;
        pointer-events: none;
      }

      /*
       * The hidden-until-launched state lives HERE, on the animated element — not on the
       * parent <svg>. Opacity on the parent multiplies with the child's, so an `opacity: 0`
       * up there made the meteor mathematically invisible no matter what the keyframes did.
       * The WAAPI animation outranks this rule and drives opacity during the parting.
       */
      .v3-hero-meteor-body {
        opacity: 0;
        transform-box: view-box;
        transform-origin: 0 0;
        will-change: transform, opacity;
      }

      /* Widths and opacities scaled from the ambient meteors. The ambient artwork is hosted
         in an <img> carrying mix-blend-mode and a low opacity; this one is inline with
         neither, so its strokes are dialled back to sit at the same visual weight. */
      .v3-hero-meteor-core {
        stroke: #fff9ff;
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-opacity: 0.62;
      }

      .v3-hero-meteor-glow {
        stroke: #b56fff;
        stroke-width: 15;
        stroke-linecap: round;
        stroke-opacity: 0.16;
      }

      .v3-hero-meteor-head {
        fill: #fff;
        filter: drop-shadow(0 0 6px rgb(255 232 255 / 100%))
          drop-shadow(0 0 16px rgb(219 122 255 / 88%));
      }

      /* Bloom on contact. Separate element rather than the card's ::before because a
         pseudo-element cannot be driven by the Web Animations API. */
      .v3-splash-impact {
        position: absolute;
        z-index: 1;
        width: 190px;
        height: 190px;
        border-radius: 999px;
        background: radial-gradient(
          circle,
          rgb(255 249 255 / 62%) 0%,
          rgb(190 105 255 / 38%) 34%,
          transparent 68%
        );
        opacity: 0;
        pointer-events: none;
      }

      @media (prefers-reduced-motion: reduce) {
        .v3-splash-hero-meteor,
        .v3-splash-impact {
          display: none;
        }
      }

      /* Lab-only: stand in for the bits React would otherwise mount. */
      body {
        margin: 0;
        overflow: hidden;
      }
      #lab-bar {
        position: fixed;
        z-index: 200;
        right: 14px;
        bottom: 14px;
        display: flex;
        gap: 8px;
      }
      #lab-bar button {
        background: color-mix(in srgb, var(--primary) 22%, transparent);
        color: var(--foreground);
        border: 1px solid color-mix(in srgb, var(--primary) 40%, transparent);
        border-radius: 10px;
        padding: 9px 16px;
        font: 500 13px/1 var(--font-sans, system-ui);
        cursor: pointer;
        backdrop-filter: blur(8px);
      }
      #lab-bar button:hover {
        background: color-mix(in srgb, var(--primary) 34%, transparent);
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="group/sidebar-wrapper flex min-h-svh w-full" style="--sidebar-width: 16rem">
        <div
          class="group peer hidden text-sidebar-foreground md:block"
          data-slot="sidebar"
          data-side="left"
          data-state="expanded"
          data-variant="sidebar"
          data-collapsible=""
        >
          <div class="relative w-(--sidebar-width) bg-transparent" data-slot="sidebar-gap"></div>
          <div
            data-app-sidebar=""
            class="fixed inset-y-0 left-0 z-10 hidden h-svh w-(--sidebar-width) md:flex border-r border-sidebar-border bg-sidebar text-sidebar-foreground"
          >
            <div data-slot="sidebar-inner" class="flex h-full w-full flex-col bg-sidebar">
              <div
                data-slot="sidebar-header"
                class="@container/sidebar-header relative flex h-[var(--workspace-topbar-height)] shrink-0 flex-row items-center px-3 py-0 md:px-0"
              >
                <a
                  class="sidebar-brand relative z-10 ml-[var(--workspace-titlebar-content-left)] flex h-8 w-fit min-w-0 shrink-0 items-center gap-1.5 overflow-hidden rounded-md text-foreground"
                  href="#"
                >
                  <img
                    alt=""
                    aria-hidden="true"
                    class="size-6 shrink-0 rounded-md shadow-[0_0_0_1px_color-mix(in_srgb,var(--primary)_18%,transparent)]"
                    data-startup-logo-target=""
                    src="./apple-touch-icon.png"
                  />
                  <span class="truncate text-base font-medium tracking-tight text-muted-foreground"
                    >Code</span
                  >
                </a>
              </div>
              <div class="flex-1 px-2 py-2 text-sidebar-muted-foreground text-sm">
                <div class="px-2 py-1.5 opacity-60">Threads</div>
              </div>
            </div>
          </div>
        </div>

        <main
          data-slot="sidebar-inset"
          class="relative flex min-w-0 w-full flex-1 flex-col bg-background surface-grain"
        >
          <div
            data-chat-composer-overlay="hero"
            class="pointer-events-none absolute inset-0 z-20 flex items-center"
          >
            <div class="chat-composer-horizontal-inset w-full">
              <div class="pointer-events-auto relative z-10">
                <div class="absolute inset-x-0 bottom-full z-0">
                  <div class="pb-8" data-startup-headline-target="">
                    <h1
                      class="mx-auto w-full max-w-5xl text-center font-normal text-2xl text-foreground tracking-tight sm:text-3xl"
                    >
                      What should we build in <span class="text-foreground">Dash</span>?
                    </h1>
                  </div>
                </div>
                <div class="relative">
                  <div
                    data-startup-composer-target=""
                    class="chat-composer-glass-shell relative mx-auto w-full max-w-3xl"
                  >
                    <div class="chat-composer-glass-host relative z-10 w-full rounded-[22px]">
                      <div class="flex min-h-[104px] flex-col justify-between gap-3 px-4 py-3">
                        <div class="text-muted-foreground/70 text-base">
                          Plan, search, build anything
                        </div>
                        <div class="flex items-center justify-between">
                          <div class="flex gap-2">
                            <div class="size-7 rounded-lg bg-foreground/8"></div>
                            <div class="size-7 rounded-lg bg-foreground/8"></div>
                          </div>
                          <div class="size-8 rounded-lg bg-primary/70"></div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
    <div id="boot-shell" class="v3-splash" role="status" aria-live="polite">
      <span class="v3-splash-status">V3 Code is starting</span>
      <img
        class="v3-splash-art v3-splash-galaxies"
        src="./v3-splash-galaxies.svg"
        alt=""
        aria-hidden="true"
      />
      <img
        class="v3-splash-art v3-splash-stars"
        src="./v3-splash-stars.svg"
        alt=""
        aria-hidden="true"
      />
      <img
        class="v3-splash-art v3-splash-signal"
        src="./v3-splash-signal.svg"
        alt=""
        aria-hidden="true"
      />
      <!--
        FAR dust field. Behind the midground band so the cloud partially veils it. Sparse,
        dim, small — three groups drift slowly and out of phase (negative delays), and the
        differential between this and the near field is what gives the smooth blurred clouds
        a trackable parallax rate. Positions are authored once, deterministically; there is no
        runtime randomness. During the parting the whole <svg> falls ~30vh and fades (see
        runStartupSplashExit).
      -->
      <svg
        class="v3-splash-art v3-splash-motes v3-splash-motes-far"
        viewBox="0 0 1600 1000"
        preserveAspectRatio="xMidYMid slice"
        aria-hidden="true"
      >
        <g class="v3-splash-mote-group v3-splash-mote-group-a">
          <circle cx="340" cy="420" r="1.4" fill="#DB7AFF" fill-opacity="0.4" />
          <circle cx="780" cy="340" r="1.5" fill="#DB7AFF" fill-opacity="0.44" />
          <circle cx="1240" cy="700" r="1.2" fill="#DB7AFF" fill-opacity="0.38" />
          <circle cx="1450" cy="460" r="1.4" fill="#FFF9FF" fill-opacity="0.26" />
        </g>
        <g class="v3-splash-mote-group v3-splash-mote-group-b">
          <circle cx="200" cy="560" r="1.3" fill="#DB7AFF" fill-opacity="0.36" />
          <circle cx="650" cy="300" r="1.5" fill="#DB7AFF" fill-opacity="0.42" />
          <circle cx="1120" cy="380" r="1.4" fill="#DB7AFF" fill-opacity="0.45" />
        </g>
        <g class="v3-splash-mote-group v3-splash-mote-group-c">
          <circle cx="510" cy="480" r="1.4" fill="#DB7AFF" fill-opacity="0.39" />
          <circle cx="960" cy="440" r="1.5" fill="#DB7AFF" fill-opacity="0.43" />
          <circle cx="1400" cy="340" r="1.3" fill="#DB7AFF" fill-opacity="0.37" />
        </g>
      </svg>
      <img
        class="v3-splash-art v3-splash-cloud-layer v3-splash-clouds-mid"
        src="./v3-splash-clouds-midground-v2.webp"
        alt=""
        aria-hidden="true"
      />
    </div>
    <div id="boot-foreground" class="v3-splash-layer" aria-hidden="true">
      <!--
        NEAR dust field. Placed before the foreground cloud bands so those bands occlude it as
        they drift, which is the occlusion cue the far field cannot get from behind. Larger,
        brighter, sparser than the far field, and its two groups drift several times faster —
        that velocity gap is the parallax. During the parting it falls ~80vh on the same
        gravity curve as the near cloud bands (see runStartupSplashExit).
      -->
      <svg
        class="v3-splash-art v3-splash-motes v3-splash-motes-near"
        viewBox="0 0 1600 1000"
        preserveAspectRatio="xMidYMid slice"
        aria-hidden="true"
      >
        <g class="v3-splash-mote-group v3-splash-mote-group-d">
          <circle cx="310" cy="560" r="1.9" fill="#DB7AFF" fill-opacity="0.52" />
          <circle cx="760" cy="430" r="2.3" fill="#FFF9FF" fill-opacity="0.44" />
          <circle cx="1180" cy="680" r="1.7" fill="#DB7AFF" fill-opacity="0.58" />
          <circle cx="1490" cy="380" r="2.1" fill="#FFF9FF" fill-opacity="0.4" />
        </g>
        <g class="v3-splash-mote-group v3-splash-mote-group-e">
          <circle cx="540" cy="720" r="2" fill="#FFF9FF" fill-opacity="0.46" />
          <circle cx="960" cy="540" r="1.8" fill="#DB7AFF" fill-opacity="0.55" />
          <circle cx="1320" cy="620" r="2.2" fill="#FFF9FF" fill-opacity="0.5" />
        </g>
      </svg>
      <img
        class="v3-splash-art v3-splash-cloud-layer v3-splash-clouds-foreground v3-splash-clouds-foreground-left"
        src="./v3-splash-clouds-foreground-v2.webp"
        alt=""
        aria-hidden="true"
      />
      <img
        class="v3-splash-art v3-splash-cloud-layer v3-splash-clouds-foreground v3-splash-clouds-foreground-center"
        src="./v3-splash-clouds-foreground-v2.webp"
        alt=""
        aria-hidden="true"
      />
      <img
        class="v3-splash-art v3-splash-cloud-layer v3-splash-clouds-foreground v3-splash-clouds-foreground-right"
        src="./v3-splash-clouds-foreground-v2.webp"
        alt=""
        aria-hidden="true"
      />
    </div>
    <div id="boot-logo" class="v3-splash-layer" aria-hidden="true">
      <div class="v3-splash-card">
        <span class="v3-splash-impact"></span>
        <!--
          Hero meteor. Rebuilt from the ambient meteor vocabulary in v3-splash-stars.svg:
          four stacked strokes (wide soft glow, gradient tail, hot thin core, filled head
          with two drop-shadows) at roughly 2.2x. That layered cross-section is what a
          single gradient bar cannot fake.

          1 user unit = 1 CSS px, and the head sits at the local origin, so a transform of
          zero puts the head exactly on the mark. The gradient id is namespaced because
          inlining un-sandboxes it from the <img>-hosted copy of the same artwork.
        -->
        <svg class="v3-splash-hero-meteor" viewBox="0 0 1 1" width="1" height="1" fill="none">
          <defs>
            <linearGradient
              id="v3-hero-meteor-tail"
              x1="-370"
              y1="0"
              x2="0"
              y2="0"
              gradientUnits="userSpaceOnUse"
            >
              <stop stop-color="#8350D9" stop-opacity="0" />
              <stop offset=".56" stop-color="#A77BFF" stop-opacity=".2" />
              <stop offset=".86" stop-color="#F27BC6" stop-opacity=".72" />
              <stop offset="1" stop-color="#FFF9FF" stop-opacity=".96" />
            </linearGradient>
          </defs>
          <g class="v3-hero-meteor-body" fill="none">
            <path class="v3-hero-meteor-glow" d="M-304 0H-11" />
            <path
              d="M-370 0H0"
              stroke="url(#v3-hero-meteor-tail)"
              stroke-width="6.2"
              stroke-linecap="round"
            />
            <path class="v3-hero-meteor-core" d="M-158 0H0" />
            <circle class="v3-hero-meteor-head" r="6.5" />
          </g>
        </svg>
        <img class="v3-splash-logo" src="./apple-touch-icon.png" alt="" aria-hidden="true" />
      </div>
    </div>
    <div id="lab-bar"><button id="lab-replay">Replay splash</button></div>
    <script type="module" src="./splash-lab.js"></script>
  </body>
</html>
