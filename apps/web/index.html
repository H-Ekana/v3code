<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161616" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#161616" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      (() => {
        const LIGHT_BACKGROUND = "#ffffff";
        const DARK_BACKGROUND = "#161616";
        const themeColorMeta = document.querySelector('meta[name="theme-color"]');
        try {
          const storedTheme = window.localStorage.getItem("t3code:theme");
          const theme =
            storedTheme === "light" || storedTheme === "dark" || storedTheme === "system"
              ? storedTheme
              : "system";
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          const isDark = theme === "dark" || (theme === "system" && prefersDark);
          document.documentElement.classList.toggle("dark", isDark);
          const chromeColor = isDark ? DARK_BACKGROUND : LIGHT_BACKGROUND;
          document.documentElement.style.backgroundColor = chromeColor;
          themeColorMeta?.setAttribute("content", chromeColor);
        } catch {
          document.documentElement.classList.add("dark");
          document.documentElement.style.backgroundColor = DARK_BACKGROUND;
          themeColorMeta?.setAttribute("content", DARK_BACKGROUND);
        }
      })();
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        background: #ffffff;
        color: #262626;
        font-family:
          "DM Sans Variable",
          "DM Sans",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          system-ui,
          sans-serif;
      }

      html.dark body {
        background: #161616;
        color: #f5f5f5;
      }

      .v3-splash {
        position: relative;
        isolation: isolate;
        display: flex;
        min-height: 100%;
        overflow: hidden;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(circle at 50% 52%, rgb(117 67 165 / 5%), transparent 22rem), #ffffff;
      }

      html.dark .v3-splash {
        background:
          radial-gradient(circle at 50% 52%, rgb(137 73 196 / 8%), transparent 23rem), #161616;
      }

      .v3-splash-art {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        user-select: none;
        object-fit: cover;
      }

      .v3-splash-stars {
        opacity: 0.2;
        mix-blend-mode: multiply;
      }

      .v3-splash-clouds {
        opacity: 0.21;
        filter: saturate(0.86) brightness(0.94);
      }

      .v3-splash-signal {
        opacity: 0.34;
        mix-blend-mode: multiply;
      }

      html.dark .v3-splash-stars {
        opacity: 0.52;
        mix-blend-mode: screen;
      }

      html.dark .v3-splash-signal {
        opacity: 0.78;
        mix-blend-mode: screen;
      }

      html.dark .v3-splash-clouds {
        opacity: 0.5;
        filter: saturate(0.82) brightness(0.9);
      }

      .v3-splash-card {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 120px;
        height: 120px;
      }

      .v3-splash-card::before {
        position: absolute;
        z-index: -1;
        width: 240px;
        height: 240px;
        border-radius: 999px;
        background: radial-gradient(circle, rgb(158 81 205 / 8%), transparent 66%);
        content: "";
      }

      .v3-splash-logo {
        width: 64px;
        height: 64px;
        filter: drop-shadow(0 9px 22px rgb(65 32 92 / 24%));
        object-fit: contain;
      }
    </style>
    <title>V3 Code (Alpha)</title>
  </head>
  <body>
    <div id="root">
      <div id="boot-shell" class="v3-splash">
        <img
          class="v3-splash-art v3-splash-stars"
          src="/v3-splash-stars.svg"
          alt=""
          aria-hidden="true"
        />
        <img
          class="v3-splash-art v3-splash-signal"
          src="/v3-splash-signal.svg"
          alt=""
          aria-hidden="true"
        />
        <img
          class="v3-splash-art v3-splash-clouds"
          src="/v3-splash-clouds.svg"
          alt=""
          aria-hidden="true"
        />
        <div class="v3-splash-card" aria-label="V3 Code splash screen">
          <img class="v3-splash-logo" src="/apple-touch-icon.png" alt="V3 Code" />
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
