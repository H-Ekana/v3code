<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161616" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#161616" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      (() => {
        const LIGHT_BACKGROUND = "#ffffff";
        const DARK_BACKGROUND = "#161616";
        const themeColorMeta = document.querySelector('meta[name="theme-color"]');
        try {
          const storedTheme = window.localStorage.getItem("t3code:theme");
          const theme =
            storedTheme === "light" || storedTheme === "dark" || storedTheme === "system"
              ? storedTheme
              : "system";
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          const isDark = theme === "dark" || (theme === "system" && prefersDark);
          document.documentElement.classList.toggle("dark", isDark);
          const chromeColor = isDark ? DARK_BACKGROUND : LIGHT_BACKGROUND;
          document.documentElement.style.backgroundColor = chromeColor;
          themeColorMeta?.setAttribute("content", chromeColor);
        } catch {
          document.documentElement.classList.add("dark");
          document.documentElement.style.backgroundColor = DARK_BACKGROUND;
          themeColorMeta?.setAttribute("content", DARK_BACKGROUND);
        }
      })();
    </script>
    <script>
      (() => {
        const sessionKey = "v3code:startup-splash-seen";
        try {
          const hasPlayed = window.sessionStorage.getItem(sessionKey) === "true";
          document.documentElement.dataset.startupSplash = hasPlayed ? "bypass" : "holding";
          if (!hasPlayed) {
            window.sessionStorage.setItem(sessionKey, "true");
          }
        } catch {
          document.documentElement.dataset.startupSplash = "holding";
        }
      })();
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        background: #ffffff;
        color: #262626;
        font-family:
          "DM Sans Variable",
          "DM Sans",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          system-ui,
          sans-serif;
      }

      html.dark body {
        background: #161616;
        color: #f5f5f5;
      }

      .v3-splash {
        position: fixed;
        z-index: 70;
        inset: 0;
        isolation: isolate;
        display: flex;
        min-height: 100dvh;
        overflow: hidden;
        align-items: center;
        justify-content: center;
        background: transparent;
        pointer-events: auto;
      }

      .v3-splash::before {
        position: absolute;
        z-index: -2;
        inset: 0;
        background:
          radial-gradient(circle at 50% 52%, rgb(117 67 165 / 5%), transparent 22rem), #ffffff;
        content: "";
      }

      .v3-splash-status {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        clip-path: inset(50%);
        white-space: nowrap;
      }

      html.dark .v3-splash::before {
        background:
          radial-gradient(circle at 50% 52%, rgb(137 73 196 / 8%), transparent 23rem), #161616;
      }

      html[data-startup-splash="bypass"] #boot-shell {
        display: none;
      }

      html[data-startup-splash="holding"] #root {
        opacity: 0;
      }

      html[data-startup-splash="exiting"] #root {
        animation: v3-startup-app-arrive 820ms cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      html[data-startup-splash="exiting"] .v3-splash::before {
        animation: v3-startup-veil-open 720ms cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      html[data-startup-splash="exiting"] [data-app-sidebar] {
        animation: v3-startup-sidebar-arrive 700ms 80ms cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      html[data-startup-splash="exiting"] [data-slot="sidebar-inset"] {
        animation: v3-startup-workspace-arrive 720ms 70ms cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      html[data-startup-splash="exiting"] [data-startup-composer-target] {
        animation: v3-startup-composer-arrive 740ms 110ms cubic-bezier(0.16, 1, 0.3, 1) both;
        will-change: transform, opacity, filter;
      }

      .v3-splash-art {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        user-select: none;
        object-fit: cover;
      }

      .v3-splash-stars {
        opacity: 0.22;
        mix-blend-mode: multiply;
      }

      .v3-splash-cloud-layer {
        right: auto;
        left: -10%;
        width: 120%;
        max-width: none;
        height: auto;
        object-fit: fill;
        object-position: center bottom;
        transform-origin: center bottom;
        will-change: transform;
      }

      .v3-splash-clouds-mid {
        top: auto;
        bottom: 5%;
        height: 52%;
        opacity: 0.16;
        filter: saturate(0.72) brightness(0.88) blur(0.45px);
        -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 38%, transparent 72%);
        mask-image: linear-gradient(to bottom, #000 0%, #000 38%, transparent 72%);
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        animation: v3-cloud-mid-drift 12s cubic-bezier(0.45, 0, 0.55, 1) -2.7s infinite alternate;
      }

      .v3-splash-clouds-foreground {
        top: auto;
        bottom: -2%;
        height: 64%;
        opacity: 0.3;
        filter: saturate(0.78) brightness(0.86) blur(0.25px);
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
      }

      .v3-splash-clouds-foreground-left {
        -webkit-mask-image: linear-gradient(to right, #000 0%, #000 34%, transparent 44%);
        mask-image: linear-gradient(to right, #000 0%, #000 34%, transparent 44%);
        animation: v3-cloud-foreground-left-drift 15s cubic-bezier(0.45, 0, 0.55, 1) -4.2s infinite
          alternate;
      }

      .v3-splash-clouds-foreground-center {
        -webkit-mask-image: linear-gradient(
          to right,
          transparent 34%,
          #000 44%,
          #000 56%,
          transparent 66%
        );
        mask-image: linear-gradient(to right, transparent 34%, #000 44%, #000 56%, transparent 66%);
        animation: v3-cloud-foreground-center-drift 18s cubic-bezier(0.45, 0, 0.55, 1) -8.1s
          infinite alternate;
      }

      .v3-splash-clouds-foreground-right {
        -webkit-mask-image: linear-gradient(to right, transparent 56%, #000 66%, #000 100%);
        mask-image: linear-gradient(to right, transparent 56%, #000 66%, #000 100%);
        animation: v3-cloud-foreground-right-drift 14s cubic-bezier(0.45, 0, 0.55, 1) -5.7s infinite
          alternate;
      }

      .v3-splash-signal {
        opacity: 0.34;
        mix-blend-mode: multiply;
      }

      html.dark .v3-splash-stars {
        opacity: 0.58;
        mix-blend-mode: screen;
      }

      html.dark .v3-splash-signal {
        opacity: 0.78;
        mix-blend-mode: screen;
      }

      html.dark .v3-splash-clouds-mid {
        opacity: 0.25;
        filter: saturate(0.76) brightness(0.74) blur(0.45px);
      }

      html.dark .v3-splash-clouds-foreground {
        opacity: 0.43;
        filter: saturate(0.82) brightness(0.76) blur(0.25px);
      }

      @keyframes v3-cloud-mid-drift {
        0% {
          transform: translate3d(-3.2%, 7px, 0) scale(1.018);
        }

        48% {
          transform: translate3d(0.4%, -10px, 0) scale(1.05);
        }

        100% {
          transform: translate3d(3.1%, 1px, 0) scale(1.032);
        }
      }

      @keyframes v3-cloud-foreground-left-drift {
        0% {
          transform: translate3d(1.6%, 5px, 0) scale(1.014);
        }

        50% {
          transform: translate3d(-0.2%, -5px, 0) scale(1.035);
        }

        100% {
          transform: translate3d(-1.3%, 1px, 0) scale(1.024);
        }
      }

      @keyframes v3-cloud-foreground-center-drift {
        0% {
          transform: translate3d(-0.8%, 3px, 0) scale(1.018);
        }

        52% {
          transform: translate3d(0.6%, -7px, 0) scale(1.04);
        }

        100% {
          transform: translate3d(1.2%, 0, 0) scale(1.026);
        }
      }

      @keyframes v3-cloud-foreground-right-drift {
        0% {
          transform: translate3d(1.4%, 6px, 0) scale(1.012);
        }

        55% {
          transform: translate3d(-0.4%, -3px, 0) scale(1.032);
        }

        100% {
          transform: translate3d(-1.7%, 2px, 0) scale(1.022);
        }
      }

      @keyframes v3-startup-app-arrive {
        0% {
          opacity: 0;
        }

        15% {
          opacity: 0.1;
        }

        68% {
          opacity: 1;
        }

        100% {
          opacity: 1;
        }
      }

      @keyframes v3-startup-veil-open {
        0%,
        16% {
          opacity: 1;
        }

        54% {
          opacity: 0.76;
        }

        100% {
          opacity: 0;
        }
      }

      @keyframes v3-startup-sidebar-arrive {
        0% {
          opacity: 0;
          filter: brightness(0.82);
          transform: translate3d(-10px, 0, 0);
        }

        100% {
          opacity: 1;
          filter: brightness(1);
          transform: translate3d(0, 0, 0);
        }
      }

      @keyframes v3-startup-workspace-arrive {
        0% {
          opacity: 0;
          filter: blur(3px);
          transform: translate3d(0, 12px, 0) scale(0.994);
        }

        100% {
          opacity: 1;
          filter: blur(0);
          transform: translate3d(0, 0, 0) scale(1);
        }
      }

      @keyframes v3-startup-composer-arrive {
        0% {
          opacity: 0;
          filter: blur(3px) brightness(0.82);
          transform: translate3d(0, min(10vh, 88px), 0) scale(0.98);
        }

        72% {
          opacity: 1;
          filter: blur(0) brightness(1.025);
          transform: translate3d(0, -2px, 0) scale(1.002);
        }

        100% {
          opacity: 1;
          filter: blur(0) brightness(1);
          transform: translate3d(0, 0, 0) scale(1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .v3-splash-clouds-mid,
        .v3-splash-clouds-foreground {
          animation: none;
        }

        .v3-splash-clouds-mid {
          transform: translateY(-2px) scale(1.03);
        }

        .v3-splash-clouds-foreground {
          transform: scale(1.022);
        }

        html[data-startup-splash="exiting"] #root {
          animation: v3-startup-app-arrive 180ms linear both;
        }

        html[data-startup-splash="exiting"] .v3-splash::before {
          animation: v3-startup-veil-open 180ms linear both;
        }

        html[data-startup-splash="exiting"] [data-app-sidebar],
        html[data-startup-splash="exiting"] [data-slot="sidebar-inset"],
        html[data-startup-splash="exiting"] [data-startup-composer-target] {
          animation: none;
        }
      }

      .v3-splash-card {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 120px;
        height: 120px;
      }

      .v3-splash-card::before {
        position: absolute;
        z-index: -1;
        width: 240px;
        height: 240px;
        border-radius: 999px;
        background: radial-gradient(circle, rgb(158 81 205 / 8%), transparent 66%);
        content: "";
      }

      .v3-splash-logo {
        width: 64px;
        height: 64px;
        filter: drop-shadow(0 9px 22px rgb(65 32 92 / 24%));
        object-fit: contain;
      }
    </style>
    <title>V3 Code (Alpha)</title>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-shell" class="v3-splash" role="status" aria-live="polite">
      <span class="v3-splash-status">V3 Code is starting</span>
      <img
        class="v3-splash-art v3-splash-stars"
        src="/v3-splash-stars.svg"
        alt=""
        aria-hidden="true"
      />
      <img
        class="v3-splash-art v3-splash-signal"
        src="/v3-splash-signal.svg"
        alt=""
        aria-hidden="true"
      />
      <img
        class="v3-splash-art v3-splash-cloud-layer v3-splash-clouds-mid"
        src="/v3-splash-clouds-midground-v2.webp"
        alt=""
        aria-hidden="true"
      />
      <img
        class="v3-splash-art v3-splash-cloud-layer v3-splash-clouds-foreground v3-splash-clouds-foreground-left"
        src="/v3-splash-clouds-foreground-v2.webp"
        alt=""
        aria-hidden="true"
      />
      <img
        class="v3-splash-art v3-splash-cloud-layer v3-splash-clouds-foreground v3-splash-clouds-foreground-center"
        src="/v3-splash-clouds-foreground-v2.webp"
        alt=""
        aria-hidden="true"
      />
      <img
        class="v3-splash-art v3-splash-cloud-layer v3-splash-clouds-foreground v3-splash-clouds-foreground-right"
        src="/v3-splash-clouds-foreground-v2.webp"
        alt=""
        aria-hidden="true"
      />
      <div class="v3-splash-card">
        <img class="v3-splash-logo" src="/apple-touch-icon.png" alt="" aria-hidden="true" />
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
